# Render Blueprint — Backend Spring Boot (sistema de gestión de agua potable)
# Cómo usar: render.com → New → Blueprint → seleccionar este repo.
# La base de datos es Supabase (ver variables DB_*). No usa Postgres gestionado de Render.
services:
  - type: web
    name: servicio-agua-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /swagger-ui.html
    envVars:
      # Puerto expuesto por Render (el app lee ${PORT})
      - key: PORT
        value: 10000
      # --- Supabase (session pooler, IPv4). El host directo db.<ref> es IPv6-only ---
      # DB_URL: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
      - key: DB_URL
        sync: false
      # DB_USER: postgres.<project_ref>   |   DB_PASSWORD: password del rol postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Dominio del frontend en Vercel (separar con comas si hay varios)
      - key: CORS_ORIGINS
        value: https://servicio-agua.vercel.app
      # Sin datos demo en producción; Hibernate crea el esquema con ddl-auto: update
      - key: APP_SEED_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Primer arranque: crea admin/SUPERADMIN si no existen (cambiar claves por variables reales)
      - key: ADMIN_AUTO_CREATE
        value: "true"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_USER
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
