spring:
  datasource:
    url: jdbc:h2:mem:servicioagua-${app.seed.enabled};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mvc:
    throw-exception-if-no-handler-found: true

app:
  seed:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173