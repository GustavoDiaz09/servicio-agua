server:
  port: 8080

spring:
  application:
    name: servicio-agua
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bd_servicio_agua}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:servicio-agua-d3v-2026-clave-jwt-hs256-minimo-32-bytes-abcdef0123456789}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    admin-auto-create: ${ADMIN_AUTO_CREATE:true}
    admin-username: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}